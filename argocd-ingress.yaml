apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    # Set to 'gce' for GKE Ingress or 'nginx' if using NGINX Ingress Controller
    kubernetes.io/ingress.class: "gce"
    # Enables HTTPS passthrough/redirection for Argo CD
    ingress.kubernetes.io/ssl-redirect: "true"
    networking.gke.io/v1beta1.FrontendConfig: "argocd-frontend-config"
spec:
  rules:
  - host: argocd.visionary.work.gd
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              name: https
